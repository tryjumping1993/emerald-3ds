name: Thor release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thor-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tryjumping1993/emerald-3ds'
    runs-on: [self-hosted, Windows, X64, emerald-thor-release]
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify signed APK
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: ./tools/ci/build-thor-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Emerald3DS-Thor-${{ github.ref_name }}
          path: |
            build/release/Emerald3DS-Thor.apk
            build/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release with generated notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists. Review it instead of replacing its APK.'
          }
          $options = @('--draft', '--verify-tag', '--generate-notes', '--title', "Emerald3DS Thor $env:RELEASE_TAG")
          if ($env:RELEASE_TAG.Contains('-')) { $options += '--prerelease' }
          gh release create $env:RELEASE_TAG @options build/release/Emerald3DS-Thor.apk build/release/SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'GitHub release creation failed.' }
